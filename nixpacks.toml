# Fallback if DockHosting ignores Dockerfile and still selects Nixpacks.
# Force the node provider and an explicit NestJS start command.
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
